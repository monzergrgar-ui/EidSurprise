<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eid Surprise for Wiam</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f3e5f5; /* Light Purple */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        #card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            transition: all 0.5s ease;
        }

        h1 { color: #6a1b9a; margin-bottom: 10px; }
        p { color: #4a148c; font-size: 1.2rem; }

        .btn-container {
            margin-top: 30px;
            position: relative;
            height: 100px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            position: absolute;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            left: 50px;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            right: 50px;
        }

        .hidden { display: none; }

        .success-msg {
            font-size: 1.5rem;
            color: #d81b60;
            animation: bounce 0.5s infinite alternate;
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <div id="card">
        <div id="questionSection">
            <h1>عيد مبارك يا وئام! ✨</h1>
            <p>Are you ready to spend the most beautiful Eid date with me?</p>
            
            <div class="btn-container">
                <button id="yesBtn">YES! 😍</button>
                <button id="noBtn">No 😢</button>
            </div>
        </div>

        <div id="successSection" class="hidden">
            <h1 style="font-size: 3rem;">🎉🥳💃</h1>
            <p class="success-msg">I knew you'd say yes, وئام!</p>
            <p>Can't wait to see you. Eid Mubarak! ❤️</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionSection = document.getElementById('questionSection');
        const successSection = document.getElementById('successSection');

        // Logic to move the "No" button
        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        });

        // Logic for "Yes" click
        yesBtn.addEventListener('click', () => {
            questionSection.classList.add('hidden');
            successSection.classList.remove('hidden');
            
            // Trigger Fireworks/Confetti
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        });
    </script>
</body>
</html>
